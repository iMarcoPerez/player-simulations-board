<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Simulations — Projections Board</title>
<style>
:root{
  --bg:#0a0e0c; --panel:#121714; --panel2:#171d19; --line:#263028;
  --txt:#eef3ef; --mut:#9db3a4; --dim:#6d8272;
  --grn:#0b6b3a; --grn2:#0e7a42; --acc:#35d07f; --acc2:#ffd34d;
  --red:#ff6b5e; --amb:#ffb84d; --chip:#1d2620;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
header{background:linear-gradient(180deg,#0d7a40,#095c30);padding:16px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.5)}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header .sub{color:#d7f2df;font-size:12.5px;margin-top:3px}
header .stamp{color:#fff;font-size:12.5px;margin-top:2px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:12px 12px 60px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pill{border:1px solid var(--line);background:var(--chip);color:var(--txt);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.pill.on{background:#eef3ef;color:#0a0e0c;border-color:#eef3ef}
.secbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.secbtn{border:1px solid var(--line);background:transparent;color:var(--mut);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.secbtn.on{background:var(--grn2);color:#fff;border-color:var(--grn2)}
.meta-note{color:var(--mut);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;white-space:pre-wrap}
.label-banner{background:#3a2c07;border:1px solid #8a6d1f;color:#ffe1a1;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin:12px 0 6px}
.status-line{color:var(--acc2);font-size:13px;font-weight:600;margin:4px 0 8px}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.note.small{font-size:12px;color:var(--dim)}
h2.sec{font-size:17px;margin:18px 0 8px}
h3.game{font-size:16px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.card .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.time{color:var(--mut);font-size:12.5px;white-space:nowrap}
.score{font-size:15px;margin-top:6px}
.score b{font-size:17px}
.vs-line{color:var(--mut);font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chip.green{background:#0d3d22;border-color:#1c6b3f;color:#7fe6ab}
.chip.red{background:#3d130d;border-color:#6b241c;color:#ff9d94}
.chip.amber{background:#3a2c07;border-color:#8a6d1f;color:#ffd34d}
.chip.gray{color:var(--mut)}
.pickchip{display:inline-block;background:#0d3d22;border:1px solid #1c6b3f;color:#c9f5da;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700;margin:3px 5px 3px 0}
.pickchip .e{color:var(--acc);font-weight:600}
details{margin-top:8px}
summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;padding:4px 0}
.player{border-top:1px solid var(--line);padding:9px 0 4px}
.player:first-of-type{border-top:none}
.pname{font-weight:700;font-size:14.5px}
.pmeta{color:var(--mut);font-size:12.5px}
.flag{color:var(--acc2);font-size:12.5px;margin-top:3px}
.inj{color:var(--amb);font-size:12.5px;font-weight:600}
.search{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px;margin:8px 0}
.morebtn{display:block;width:100%;margin:12px 0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
.evt{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.evt .et{color:var(--dim);font-size:12px;white-space:nowrap;min-width:86px}
.evt .mv{font-weight:700;white-space:nowrap}
.up{color:var(--acc)} .down{color:var(--red)}
.empty{color:var(--mut);padding:18px 4px}
.err{color:var(--red);padding:14px 4px}
.win{color:var(--acc);font-weight:800}.loss{color:var(--red);font-weight:800}.push{color:var(--acc2);font-weight:800}
footer{color:var(--dim);font-size:12px;text-align:center;padding:20px 10px 30px}
.kv{color:var(--mut);font-size:13px}.kv b{color:var(--txt)}
.ptoggle{display:block;margin:7px 0 2px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--acc);font-size:13px;font-weight:600;cursor:pointer}
.pdetail{margin:2px 0 8px}
.pdtitle{font-weight:700;font-size:13.5px;margin:12px 0 2px}
</style>
</head>
<body>
<header>
  <h1>Player Simulations</h1>
  <div class="sub">Snapshot — refreshed a few times a day. Projections &amp; filed model picks; nothing here updates live.</div>
  <div class="stamp" id="stamp">Loading snapshot…</div>
</header>
<div class="wrap">
  <div class="pills" id="sportPills"></div>
  <div id="sportRoot"></div>
  <h2 class="sec">Movement Feed</h2>
  <div id="feedRoot"><div class="empty">Loading movement feed…</div></div>
</div>
<footer>Player Simulations — snapshot board. Lines and projections are as of the stamp above.</footer>

<script>
"use strict";
const ET = "America/New_York";
const cache = {};
let META = null, curSport = null, curSection = {};

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isNum(v){ return typeof v === "number" && isFinite(v); }
function f1(v){ return isNum(v) ? (Math.round(v*10)/10).toString() : "—"; }
function f0(v){ return isNum(v) ? Math.round(v).toString() : "—"; }
function pct(v){ return isNum(v) ? Math.round(v*100) + "%" : "—"; }
function ml(v){ if(!isNum(v)) return "—"; return v > 0 ? "+" + Math.round(v) : "" + Math.round(v); }
function signed(v, dec){ if(!isNum(v)) return "—"; const s = dec ? f1(Math.abs(v)) : f0(Math.abs(v)); return (v>0?"+":"−") + s; }
function fmtET(iso, withDate){
  if(iso===null||iso===undefined||iso==="") return "";
  const d = (typeof iso === "number") ? new Date(iso) : new Date(iso);
  if(isNaN(d)) return String(iso);
  const o = {timeZone: ET, hour:"numeric", minute:"2-digit"};
  if(withDate){ o.weekday="short"; o.month="short"; o.day="numeric"; }
  try { return new Intl.DateTimeFormat("en-US", o).format(d); } catch(e){ return d.toLocaleString(); }
}
function fmtDay(iso){
  if(!iso) return "";
  const bare = /^\d{4}-\d{2}-\d{2}$/.test(String(iso));
  const d = new Date(iso);
  if(isNaN(d)) return String(iso);
  try { return new Intl.DateTimeFormat("en-US",{timeZone: bare ? "UTC" : ET, weekday:"short", month:"short", day:"numeric"}).format(d); }
  catch(e){ return String(iso); }
}
async function loadJSON(path){
  if(cache[path]) return cache[path];
  const r = await fetch(path);
  if(!r.ok) throw new Error("HTTP " + r.status + " for " + path);
  const j = await r.json();
  cache[path] = j;
  return j;
}
function hasContent(obj){
  if(!obj || typeof obj !== "object") return false;
  return Object.keys(obj).length > 0;
}
function nonEmptyArr(a){ return Array.isArray(a) && a.length > 0; }
</script>
<script>
/* ---------- sport tabs & sections ---------- */
const PRELIM_FILE = { nba:"getNbaPrelim.json", nfl:"getNflPrelim.json", nhl:"getNhlPrelim.json", cs2:"getCs2Prelim.json" };
const SPORT_NAME = { nba:"NBA", nfl:"NFL", soccer:"Soccer", tennis:"Tennis", cs2:"CS2", nhl:"NHL" };

async function sectionAvailable(sport){
  const avail = {};
  if(PRELIM_FILE[sport]){
    try { const p = await loadJSON("data/" + PRELIM_FILE[sport]); avail.prelim = hasContent(p); }
    catch(e){ avail.prelim = false; }
  }
  try { const g = await loadJSON("data/getGames_" + sport + ".json"); avail.games = nonEmptyArr(g.games); } catch(e){ avail.games = false; }
  try { const p = await loadJSON("data/getPicks_" + sport + ".json"); avail.picks = nonEmptyArr(p.picks); } catch(e){ avail.picks = false; }
  try { const b = await loadJSON("data/getBoard_" + sport + ".json"); avail.board = nonEmptyArr(b.players); } catch(e){ avail.board = false; }
  try { const g = await loadJSON("data/getGrades_" + sport + ".json"); avail.grades = nonEmptyArr(g.grades) || !!(g.meta && g.meta.headline); } catch(e){ avail.grades = false; }
  return avail;
}

function renderSportPills(){
  const el = document.getElementById("sportPills");
  el.innerHTML = META.sports.map(s =>
    `<button class="pill ${s.sport===curSport?"on":""}" data-sport="${esc(s.sport)}">${esc(SPORT_NAME[s.sport]||s.sport.toUpperCase())}</button>`
  ).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => selectSport(b.dataset.sport)));
}

async function selectSport(sport){
  curSport = sport;
  renderSportPills();
  const root = document.getElementById("sportRoot");
  root.innerHTML = `<div class="empty">Loading ${esc(SPORT_NAME[sport]||sport)}…</div>`;
  const meta = META.sports.find(s => s.sport === sport);
  const avail = await sectionAvailable(sport);
  const secs = [];
  if(avail.prelim) secs.push(["prelim","Prelim / Tonight"]);
  if(avail.games) secs.push(["games","Games"]);
  if(avail.picks) secs.push(["picks","Model Picks"]);
  if(avail.board) secs.push(["board","Projections"]);
  if(avail.grades) secs.push(["grades","Grades"]);
  if(!secs.length){ root.innerHTML = `<div class="empty">No sections available for this sport in this snapshot.</div>`; return; }
  if(!curSection[sport] || !secs.some(s => s[0]===curSection[sport])) curSection[sport] = secs[0][0];
  let html = "";
  if(meta){
    html += `<div class="meta-note"><b>${esc(meta.slateLabel||"")}</b> · ${esc(meta.playerCount)} players on the board`;
    if(meta.projSource) html += `<br>${esc(meta.projSource)}`;
    if(meta.sourceNote) html += `<br>${esc(meta.sourceNote)}`;
    html += `</div>`;
  }
  html += `<div class="secbar">` + secs.map(s =>
    `<button class="secbtn ${s[0]===curSection[sport]?"on":""}" data-sec="${s[0]}">${s[1]}</button>`).join("") + `</div>`;
  html += `<div id="secRoot"></div>`;
  root.innerHTML = html;
  root.querySelectorAll(".secbtn").forEach(b => b.addEventListener("click", () => {
    curSection[sport] = b.dataset.sec;
    root.querySelectorAll(".secbtn").forEach(x => x.classList.toggle("on", x.dataset.sec===curSection[sport]));
    renderSection(sport);
  }));
  renderSection(sport);
}

async function renderSection(sport){
  const el = document.getElementById("secRoot");
  if(!el) return;
  const sec = curSection[sport];
  el.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if(sec === "prelim"){
      if(sport === "nba") el.innerHTML = renderNbaPrelim(await loadJSON("data/getNbaPrelim.json"));
      else if(sport === "nfl") el.innerHTML = renderNflPrelim(await loadJSON("data/getNflPrelim.json"));
      else if(sport === "nhl") el.innerHTML = renderNhlPrelim(await loadJSON("data/getNhlPrelim.json"));
      else if(sport === "cs2") el.innerHTML = renderCs2Prelim(await loadJSON("data/getCs2Prelim.json"));
      wireNflPrelimToggles(el);
    } else if(sec === "games"){
      el.innerHTML = renderGames(await loadJSON("data/getGames_" + sport + ".json"), sport);
    } else if(sec === "picks"){
      el.innerHTML = renderPicks(await loadJSON("data/getPicks_" + sport + ".json"));
    } else if(sec === "board"){
      el.innerHTML = renderBoardShell(sport);
      wireBoard(el, sport, await loadJSON("data/getBoard_" + sport + ".json"));
    } else if(sec === "grades"){
      el.innerHTML = renderGrades(await loadJSON("data/getGrades_" + sport + ".json"));
    }
  } catch(e){
    el.innerHTML = `<div class="err">This section could not be loaded from the snapshot.</div>`;
  }
}

/* ---------- NBA prelim ---------- */
function renderNbaPrelim(d){
  let h = "";
  h += `<div class="label-banner">${esc(d.label||"")}</div>`;
  h += `<div class="kv">Slate ${esc(d.slateDate||"")} · Lines pulled ${esc(fmtET(d.linesPulledUtc,true))} ET · Injuries feed ${esc(fmtET(d.injuriesFeedTs,true))} ET · Gathered ${esc(fmtET(d.gatheredAt,true))} ET</div>`;
  (d.games||[]).forEach(g => {
    h += `<div class="card"><div class="top"><h3 class="game">${esc(g.away)} @ ${esc(g.home)}</h3><span class="time">${esc(fmtDay(g.startsAt))} · ${esc(fmtET(g.startsAt))} ET</span></div>`;
    h += `<div class="score">Projected: ${esc(g.away)} <b>${f1(g.projAway)}</b> — ${esc(g.home)} <b>${f1(g.projHome)}</b> · Total <b>${f1(g.projTotal)}</b></div>`;
    h += `<div class="vs-line">Win prob: ${esc(g.away)} ${pct(g.winProbAway)} · ${esc(g.home)} ${pct(g.winProbHome)} · Fair ML ${esc(g.away)} ${ml(g.fairMlAway)} / ${esc(g.home)} ${ml(g.fairMlHome)} · Fair spread ${esc(g.home)} ${signed(g.fairSpreadHome,true)}</div>`;
    h += `<div class="vs-line">Book (${esc(g.bookProvider||"book")}): spread ${esc(g.home)} ${signed(g.bookSpreadHome,true)} · total ${f1(g.bookTotal)} · ML ${esc(g.away)} ${ml(g.bookMlAway)} / ${esc(g.home)} ${ml(g.bookMlHome)}</div>`;
    (g.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
    h += `<details><summary>${(g.players||[]).length} players — projections &amp; props</summary>`;
    (g.players||[]).forEach(p => { h += renderNbaPrelimPlayer(p); });
    h += `</details></div>`;
  });
  if(nonEmptyArr(d.injuries)){
    h += `<div class="card"><h3 class="game">Injuries (${d.injuries.length})</h3>`;
    h += `<div class="tblwrap"><table><tr><th>Team</th><th>Player</th><th>Status</th><th>Detail</th></tr>`;
    d.injuries.forEach(i => { h += `<tr><td>${esc(i.team)}</td><td>${esc(i.name)}</td><td>${esc(i.status)}</td><td>${esc(i.detail||"")}</td></tr>`; });
    h += `</table></div></div>`;
  }
  return h;
}
function renderNbaPrelimPlayer(p){
  let h = `<div class="player"><span class="pname">${esc(p.name)}</span> <span class="pmeta">${esc(p.team||"")}${p.position?" · "+esc(p.position):""}${p.role?" · "+esc(p.role):""}${isNum(p.projMin)?" · "+f1(p.projMin)+" min proj":""}</span>`;
  if(p.bookFlag) h += `<div class="flag">⚠ ${esc(p.bookFlag)}</div>`;
  const props = (p.props||[]).slice().sort((a,b) => ((b.line!=null)-(a.line!=null)));
  if(props.length){
    h += `<div class="tblwrap"><table><tr><th>Stat</th><th class="num">Line</th><th>Book</th><th class="num">Proj (avg)</th><th class="num">Base</th><th class="num">Eff</th><th class="num">Pool</th><th class="num">Adj</th></tr>`;
    props.forEach(pr => {
      h += `<tr><td>${esc(pr.stat)}</td><td class="num">${pr.line!=null?f1(pr.line):"—"}</td><td>${esc(pr.book||"—")}</td><td class="num"><b>${f1(pr.avg)}</b></td><td class="num">${f1(pr.base)}</td><td class="num">${f1(pr.eff)}</td><td class="num">${f1(pr.pool)}</td><td class="num">${f1(pr.adj)}</td></tr>`;
    });
    h += `</table></div>`;
  }
  h += `</div>`;
  return h;
}

/* ---------- NFL prelim ---------- */
function renderNflPrelim(d){
  let h = `<div class="kv">Gathered ${esc(fmtET(d.gatheredAt,true))} ET</div>`;
  (d.slates||[]).forEach((s, si) => {
    h += `<div class="label-banner">${esc(s.slateDate||"")} — ${esc(s.label||"")}</div>`;
    if(s.status) h += `<div class="status-line">${esc(s.status)}</div>`;
    h += `<div class="kv">${esc(s.gamesCount)} game(s) · ${esc(s.playersPosted)} players posted · ${esc(s.propsPosted)} props posted · ${esc(s.propsProjected)} projected · ${esc(s.standardCount)} standard lines · Lines pulled ${esc(fmtET(s.linesPulledUtc,true))} ET</div>`;
    (s.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
    (s.games||[]).forEach((g, gi) => {
      const gid = `nflp-${si}-${gi}`;
      h += `<div class="card"><div class="top"><h3 class="game">${esc(g.away)} @ ${esc(g.home)}</h3><span class="time">${esc(fmtDay(g.startsAt))} · ${esc(fmtET(g.startsAt))} ET${g.stadium?" · "+esc(g.stadium):""}</span></div>`;
      h += `<div class="vs-line">${esc(g.propsPosted)} props posted · ${esc(g.projectedCount)} projected</div>`;
      (g.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
      if(nonEmptyArr(g.injuries)){
        h += `<div class="note">Injuries: ` + g.injuries.map(i => `${esc(i.name)} (${esc(i.team)}) — <span class="inj">${esc(i.status)}</span>`).join(" · ") + `</div>`;
      }
      h += `<button class="morebtn" data-toggle="${gid}">Show ${(g.players||[]).length} players &amp; projected props</button><div id="${gid}" style="display:none">`;
      (g.players||[]).forEach(p => { h += renderNflPrelimPlayer(p); });
      h += `</div></div>`;
    });
  });
  return h;
}
function renderNflPrelimPlayer(p){
  const props = p.props||[];
  const projected = props.filter(pr => pr.projection != null || pr.mean != null);
  let h = `<div class="player"><span class="pname">${esc(p.name)}</span> <span class="pmeta">${esc(p.team||"")}</span>`;
  if(p.injury) h += ` <span class="inj">${esc(p.injury)}</span>`;
  if(projected.length){
    h += `<div class="tblwrap"><table><tr><th>Stat</th><th class="num">Line</th><th>Type</th><th class="num">Proj</th><th class="num">Mean</th><th class="num">P10</th><th class="num">P90</th></tr>`;
    projected.forEach(pr => {
      h += `<tr><td>${esc(pr.stat)}</td><td class="num">${pr.line!=null?f1(pr.line):"—"}</td><td>${esc(pr.lineType||"")}</td><td class="num"><b>${f1(pr.projection)}</b></td><td class="num">${f1(pr.mean)}</td><td class="num">${f1(pr.p10)}</td><td class="num">${f1(pr.p90)}</td></tr>`;
    });
    h += `</table></div>`;
  }
  const rest = props.length - projected.length;
  if(rest > 0) h += `<div class="note small">${rest} additional posted line(s) not projected by the engine.</div>`;
  if(!projected.length && !props.length) h += `<div class="note small">No posted props.</div>`;
  h += `</div>`;
  return h;
}
function wireNflPrelimToggles(el){
  el.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.toggle);
    if(!t) return;
    const open = t.style.display !== "none";
    t.style.display = open ? "none" : "block";
    b.textContent = open ? b.textContent.replace("Hide","Show") : b.textContent.replace("Show","Hide");
  }));
}
</script>
<script>
/* ---------- NHL prelim ---------- */
function renderNhlPrelim(d){
  let h = `<div class="label-banner">${esc(d.label||"")}</div>`;
  h += `<div class="kv">Slate ${esc(d.slateDate||"")} · ${esc(d.gamesCount)} games · ${esc(d.gamesWithheld)} withheld · Lines pulled ${esc(fmtET(d.linesPulledUtc,true))} ET · Gathered ${esc(fmtET(d.gatheredAt,true))} ET</div>`;
  (d.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
  (d.games||[]).forEach(g => {
    h += `<div class="card"><div class="top"><h3 class="game">${esc(g.away)} @ ${esc(g.home)}</h3><span class="time">${esc(fmtDay(g.startsAt))} · ${esc(fmtET(g.startsAt))} ET${g.venue?" · "+esc(g.venue):""}</span></div>`;
    if(g.status) h += `<div class="status-line">${esc(g.status)}</div>`;
    h += `<div class="vs-line">Goalies (projected, unconfirmed): ${esc(g.away)} — ${esc(g.awayGoalie||"")} (${esc(g.awayGoalieStatus||"")}, SV% ${esc(g.awaySvPct||"—")}) · ${esc(g.home)} — ${esc(g.homeGoalie||"")} (${esc(g.homeGoalieStatus||"")}, SV% ${esc(g.homeSvPct||"—")})</div>`;
    h += `<div class="vs-line">Book: ML ${esc(g.away)} ${ml(g.mlAway)} / ${esc(g.home)} ${ml(g.mlHome)} · Total ${f1(g.total)} · Puck line ${esc(g.away)} ${esc(g.puckAway||"")} / ${esc(g.home)} ${esc(g.puckHome||"")}${g.marketSource?" · "+esc(g.marketSource):""}</div>`;
    h += `</div>`;
  });
  if(nonEmptyArr(d.players)){
    h += `<details><summary>${d.players.length} pool players — all withheld (tap to view)</summary>`;
    h += `<div class="tblwrap"><table><tr><th>Player</th><th>Team</th><th>Opp</th><th>Pos</th><th>Stat</th><th>Status</th></tr>`;
    d.players.forEach(p => {
      h += `<tr><td>${esc(p.name)}</td><td>${esc(p.team||"")}</td><td>${esc(p.opp||"")}</td><td>${esc(p.position||"")}</td><td>${esc(p.stat||"")}</td><td>${esc(p.status||"")}</td></tr>`;
    });
    h += `</table></div></details>`;
  }
  return h;
}

/* ---------- CS2 prelim ---------- */
function renderCs2Prelim(d){
  let h = `<div class="label-banner">${esc(d.label||"")}</div>`;
  h += `<div class="kv">Slate ${esc(d.slateDate||"")} · ${esc(d.matchesCount)} matches · ${esc(d.playersCount)} players · Lines pulled ${esc(fmtET(d.linesPulledUtc,true))} ET · Gathered ${esc(fmtET(d.gatheredAt,true))} ET</div>`;
  (d.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
  (d.matches||[]).forEach(m => {
    h += `<div class="card"><div class="top"><h3 class="game">${esc(m.match)}</h3><span class="time">${esc(m.startEt||fmtET(m.startsAt,true))}</span></div>`;
    if(m.event) h += `<div class="note small">${esc(m.event)}</div>`;
    h += `<div class="vs-line">Expected rounds ${f1(m.expectedRounds)} · Modal score: ${esc(m.modalScore||"—")}</div>`;
    (m.teams||[]).forEach(t => {
      h += `<div class="vs-line"><b>${esc(t.name)}</b>${t.hltvRank?" · HLTV #"+esc(t.hltvRank):""}${t.tierLabel?" · "+esc(t.tierLabel):""} · Win prob ${pct(t.winProb)} · Fair ML ${ml(t.fairMl)}</div>`;
    });
    (m.players||[]).forEach(p => {
      h += `<div class="player"><span class="pname">${esc(p.name)}</span> <span class="pmeta">${esc(p.team||"")} · ${esc(p.sampleMaps)} maps / ${esc(p.sampleRounds)} rounds · KPR ${f1(p.kpr)} · HS% ${pct(p.hsRate)}</span>`;
      (p.stats||[]).forEach(st => {
        h += `<div class="tblwrap"><table><tr><th>${esc(st.stat)}</th><th class="num">Base</th><th class="num">EPA</th><th class="num">Pool</th><th class="num">Adj</th><th class="num">Adj+Mom</th><th class="num">AVG</th></tr>`;
        h += `<tr><td>Projection</td><td class="num">${f1(st.base)}</td><td class="num">${f1(st.epa)}</td><td class="num">${f1(st.pool)}</td><td class="num">${f1(st.adj)}</td><td class="num">${f1(st.adjmom)}</td><td class="num"><b>${f1(st.avg)}</b></td></tr></table></div>`;
        (st.rungs||[]).forEach(r => {
          h += `<span class="chip ${r.lean==="OVER"?"green":(r.lean==="UNDER"?"red":"gray")}">${esc(r.book)} ${f1(r.line)} (${esc(r.lineType||"")}) — ${esc(r.lean||"")}${isNum(r.diff)?" · diff "+signed(r.diff,true):""}${r.agreeAll?" · ★ all models agree":""}</span>`;
          if(r.note) h += `<div class="note small">${esc(r.note)}</div>`;
        });
      });
      h += `</div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ---------- Games ---------- */
function renderGames(d, sport){
  const games = d.games||[];
  if(!games.length) return `<div class="empty">No games in this snapshot.</div>`;
  let h = "";
  games.forEach(g => {
    const p = g.proj||{}, b = g.book||{};
    h += `<div class="card"><div class="top"><h3 class="game">${esc(g.away)} @ ${esc(g.home)}</h3><span class="time">${esc(fmtDay(g.startsAt))}${/T/.test(g.startsAt||"")?" · "+esc(fmtET(g.startsAt))+" ET":""}${g.league?" · "+esc(g.league):""}</span></div>`;
    if(p.projAway != null || p.projHome != null){
      h += `<div class="score">Projected: ${esc(g.away)} <b>${f1(p.projAway)}</b> — ${esc(g.home)} <b>${f1(p.projHome)}</b>${p.projTotal!=null?" · Total <b>"+f1(p.projTotal)+"</b>":""}</div>`;
    }
    const bits = [];
    if(p.winProbHome != null) bits.push(`Win prob — ${esc(g.away)} ${pct(isNum(p.winProbHome)?1-p.winProbHome:null)} · ${esc(g.home)} ${pct(p.winProbHome)}`);
    if(p.fairMlHome != null || p.fairMlAway != null) bits.push(`Fair ML ${esc(g.away)} ${ml(p.fairMlAway)} / ${esc(g.home)} ${ml(p.fairMlHome)}`);
    if(p.fairSpreadHome != null) bits.push(`Fair spread ${esc(g.home)} ${signed(p.fairSpreadHome,true)}`);
    if(bits.length) h += `<div class="vs-line">${bits.join(" · ")}</div>`;
    const bb = [];
    if(b.spreadHome != null) bb.push(`Spread ${esc(g.home)} ${signed(b.spreadHome,true)}`);
    if(b.total != null) bb.push(`Total ${f1(b.total)}`);
    if(b.mlHome != null || b.mlAway != null) bb.push(`ML ${esc(g.away)} ${ml(b.mlAway)} / ${esc(g.home)} ${ml(b.mlHome)}`);
    if(bb.length) h += `<div class="vs-line">Book: ${bb.join(" · ")}</div>`;
    if(p.shotsHome != null || p.sotHome != null || p.possHome != null){
      const sb = [];
      if(p.shotsAway != null || p.shotsHome != null) sb.push(`Shots ${f0(p.shotsAway)}–${f0(p.shotsHome)}`);
      if(p.sotAway != null || p.sotHome != null) sb.push(`On target ${f1(p.sotAway)}–${f1(p.sotHome)}`);
      if(p.possAway != null || p.possHome != null) sb.push(`Possession ${f0(p.possAway)}%–${f0(p.possHome)}%`);
      h += `<div class="vs-line">Model (${esc(g.away)}–${esc(g.home)}): ${sb.join(" · ")}</div>`;
    }
    (g.picks||[]).forEach(pk => {
      h += `<span class="pickchip">MODEL PICK — ${esc(pk.market)}: ${esc(pk.side)} <span class="e">edge ${isNum(pk.edge)?signed(pk.edge,true):"—"} · ${pct(pk.prob)}</span></span>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ---------- Model picks ---------- */
function revChip(rev){
  if(!rev) return "";
  const r = String(rev).toUpperCase();
  const cls = r.indexOf("DEAD") === 0 ? "red" : (r.indexOf("DOWNGRADED") === 0 || r.indexOf("WEAKENED") === 0 ? "amber" : "gray");
  return `<span class="chip ${cls}">${esc(rev)}</span>`;
}
function renderPicks(d){
  let h = "";
  if(d.slateLabel) h += `<div class="label-banner">${esc(d.slateLabel)}</div>`;
  if(d.revisionLabel) h += `<div class="status-line">${esc(d.revisionLabel)}</div>`;
  if(d.note) h += `<div class="note">${esc(d.note)}</div>`;
  (d.picks||[]).forEach(pk => {
    h += `<div class="card"><div class="top"><h3 class="game">${esc(pk.name)}</h3><span class="time">${esc(pk.matchup||"")}${pk.date?" · "+esc(fmtDay(pk.date)):""}</span></div>`;
    h += `<div class="pmeta">${esc(pk.team||"")}${pk.position?" · "+esc(pk.position):""}</div>`;
    h += `<div class="score"><b>${esc(pk.direction)} ${f1(pk.line)}</b> ${esc(pk.statLabel||pk.stat||"")} · ${esc(pk.book||"")}</div>`;
    const bits = [];
    if(pk.proj != null) bits.push(`Proj ${f1(pk.proj)}`);
    if(pk.projMean != null) bits.push(`Mean ${f1(pk.projMean)}`);
    if(pk.logMedian != null) bits.push(`Log median ${f1(pk.logMedian)}`);
    if(pk.grade) bits.push(`Grade ${esc(pk.grade)}`);
    if(pk.source) bits.push(esc(pk.source));
    if(bits.length) h += `<div class="vs-line">${bits.join(" · ")}</div>`;
    h += `<div>${revChip(pk.revision)}</div>`;
    if(pk.moveFlag) h += `<div class="flag">⚠ ${esc(pk.moveFlag)}</div>`;
    if(pk.revisionReason) h += `<details><summary>Revision detail</summary><div class="note">${esc(pk.revisionReason)}</div></details>`;
    if(pk.contingent) h += `<details><summary>Status note</summary><div class="note">${esc(pk.contingent)}</div></details>`;
    h += `</div>`;
  });
  if(!(d.picks||[]).length) h += `<div class="empty">No filed picks for this sport in this snapshot.</div>`;
  return h;
}
</script>
<script>
/* ---------- Projections board ---------- */
const STAT_LABEL = { pts:"PTS", reb:"REB", ast:"AST", pra:"PRA", pr:"PR", pa:"PA", ra:"RA", stl:"STL", blk:"BLK", tpm:"3PM", tpa:"3PA", tov:"TOV",
  kills:"Kills", hs:"Headshots", pass_yds:"Pass Yds", pass_tds:"Pass TDs", rush_yds:"Rush Yds", rec_yds:"Rec Yds", receptions:"Receptions",
  sog:"Shots on Goal", goals:"Goals", assists:"Assists", saves:"Saves", shots:"Shots", sot:"Shots on Target" };
function statLabel(k){ return STAT_LABEL[k] || String(k).replace(/_/g," ").toUpperCase(); }

function renderBoardShell(sport){
  return `<input class="search" id="bq" type="search" placeholder="Search players on the ${esc(SPORT_NAME[sport]||sport)} board…" autocomplete="off">
  <div class="kv" id="bcount"></div><div id="blist"></div><button class="morebtn" id="bmore">Show more</button>`;
}
function wireBoard(el, sport, data){
  const players = data.players||[];
  const q = el.querySelector("#bq"), list = el.querySelector("#blist"),
        more = el.querySelector("#bmore"), count = el.querySelector("#bcount");
  let shown = 60;
  const byKey = {};
  players.forEach(p => { if(p.pkey) byKey[p.pkey] = p; });
  function filtered(){
    const term = (q.value||"").trim().toLowerCase();
    if(!term) return players;
    return players.filter(p => (p.name||"").toLowerCase().includes(term) || (p.team||"").toLowerCase().includes(term));
  }
  function draw(){
    const f = filtered();
    const slice = f.slice(0, shown);
    count.textContent = `Showing ${slice.length} of ${f.length} players` + ((q.value||"").trim() ? " (filtered)" : "");
    list.innerHTML = slice.map(p => renderBoardPlayer(p, sport)).join("") || `<div class="empty">No players match.</div>`;
    more.style.display = f.length > shown ? "block" : "none";
    slice.forEach(p => {
      const st = detailState[detailKey(sport, p.pkey)];
      if(st && st.open && !st.html) ensureDetail(sport, p);
    });
  }
  function setOpen(p, open){
    const key = detailKey(sport, p.pkey);
    const st = detailState[key] || (detailState[key] = {open:false, html:null});
    st.open = open;
    const btn = document.getElementById("pt-" + p.pkey);
    if(btn) btn.textContent = open ? "Hide details ▴" : "Details — averages & game log ▾";
    const panel = document.getElementById("pd-" + p.pkey);
    if(panel){
      panel.style.display = open ? "block" : "none";
      if(open && !st.html){
        panel.innerHTML = `<div class="note small">Loading game log…</div>`;
        ensureDetail(sport, p);
      }
    }
  }
  list.addEventListener("click", e => {
    const b = e.target && e.target.closest ? e.target.closest("[data-pkey]") : null;
    if(!b) return;
    const p = byKey[b.dataset.pkey];
    if(!p) return;
    const st = detailState[detailKey(sport, p.pkey)];
    setOpen(p, !(st && st.open));
  });
  q.addEventListener("input", () => { shown = 60; draw(); });
  more.addEventListener("click", () => { shown += 60; draw(); });
  draw();
  const wantPlayer = new URLSearchParams(location.search).get("player");
  if(wantPlayer && byKey[wantPlayer]){
    const idx = players.indexOf(byKey[wantPlayer]);
    if(idx >= shown){ shown = idx + 1; draw(); }
    setOpen(byKey[wantPlayer], true);
    const node = document.getElementById("bp-" + wantPlayer);
    if(node) node.scrollIntoView();
  }
}

/* ---------- Player detail (averages / props / splits / game log) ---------- */
const STAT_ORDER = {
  nba: ["pts","reb","ast","pra","pr","pa","ra","tpm","tpa","fga","stl","blk","stl_blk","tov","min"],
  nfl: ["pass_yds","pass_att","pass_cmp","pass_tds","int","rush_yds","rush_att","rush_tds","rec_yds","rec","targets","rec_tds","rush_rec_yds","pass_rush_yds","tds"],
  soccer: ["g","a","ga","sh","sot","pass","kp","drb","tkl","int","clr","sv","fls","min"],
  tennis: ["aces","df","gw","tg","sw","tsets","bpw","tb","fantasy"],
  cs2: ["kills","hs"],
  nhl: ["sog"]
};
const STAT_SHORT = { pts:"PTS", reb:"REB", ast:"AST", pra:"PRA", pr:"PR", pa:"PA", ra:"RA", tpm:"3PM", tpa:"3PA", fga:"FGA", stl:"STL", blk:"BLK", stl_blk:"B+S", tov:"TOV", min:"MIN",
  pass_yds:"Pass Yds", pass_att:"Pass Att", pass_cmp:"Cmp", pass_tds:"Pass TD", int:"INT", rush_yds:"Rush Yds", rush_att:"Rush Att", rush_tds:"Rush TD", rec_yds:"Rec Yds", rec:"Rec", targets:"Tgt", rec_tds:"Rec TD", rush_rec_yds:"R+R Yds", pass_rush_yds:"P+R Yds", tds:"TDs",
  g:"G", a:"A", ga:"G+A", sh:"Sh", sot:"SOT", pass:"Pass", kp:"KP", drb:"Drb", tkl:"Tkl", clr:"Clr", sv:"Sv", fls:"Fls",
  aces:"Aces", df:"DF", gw:"GW", tg:"TG", sw:"SW", tsets:"Sets", bpw:"BPW", tb:"TB", fantasy:"Fant", kills:"Kills", hs:"HS", sog:"SOG" };
function statShort(k){ return STAT_SHORT[k] || statLabel(k); }
function statDP(sport, k){
  if(sport === "soccer") return k === "min" ? 0 : (k === "pass" ? 1 : 2);
  if(sport === "nfl") return k === "tds" ? 2 : 1;
  if(sport === "tennis" || sport === "nhl") return 2;
  return 1;
}
function fd(v, dp){ return isNum(v) ? v.toFixed(dp) : "—"; }
function orderedKeys(sport, keySet){
  const ord = STAT_ORDER[sport] || [];
  const ks = Array.from(keySet);
  ks.sort((a, b) => {
    const ia = ord.indexOf(a), ib = ord.indexOf(b);
    if(ia < 0 && ib < 0) return a < b ? -1 : 1;
    if(ia < 0) return 1;
    if(ib < 0) return -1;
    return ia - ib;
  });
  return ks;
}

const detailState = {};   // "sport:pkey" -> {open, html}
const logIndexCache = {}; // sport -> {pkey: shard} | null (no sharding for this sport)
let logIndexPromise = {};
const shardCache = {};    // "sport:n" -> {pkey: [logs]}
function detailKey(sport, pkey){ return sport + ":" + pkey; }
async function getLogIndex(sport){
  if(sport in logIndexCache) return logIndexCache[sport];
  if(!logIndexPromise[sport]){
    logIndexPromise[sport] = loadJSON("data/logs_" + sport + "_index.json")
      .then(j => { logIndexCache[sport] = j; return j; })
      .catch(() => { logIndexCache[sport] = null; return null; });
  }
  return logIndexPromise[sport];
}
async function getPlayerLogs(sport, p){
  if(Array.isArray(p.logs)) return p.logs;
  const idx = await getLogIndex(sport);
  if(!idx || !(p.pkey in idx)) return null;
  const key = sport + ":" + idx[p.pkey];
  if(!shardCache[key]) shardCache[key] = await loadJSON("data/logs_" + sport + "_" + idx[p.pkey] + ".json");
  const logs = shardCache[key][p.pkey];
  return Array.isArray(logs) ? logs : null;
}
async function ensureDetail(sport, p){
  const key = detailKey(sport, p.pkey);
  const st = detailState[key] || (detailState[key] = {open:false, html:null});
  if(st.html) return;
  const logs = await getPlayerLogs(sport, p);
  let h = renderAvgsTable(sport, p) + renderPropTable(p) + renderSplits(sport, p);
  if(logs && logs.length) h += renderLogTable(sport, logs);
  else h += `<div class="pdtitle">Game log</div><div class="note small">No recorded game logs for this player in this snapshot.</div>`;
  st.html = h;
  const el = document.getElementById("pd-" + p.pkey);
  if(el && curSport === sport && st.open) el.innerHTML = h;
}
function renderAvgsTable(sport, p){
  const av = p.avgs || {};
  const keys = new Set();
  ["season","l10","l5"].forEach(s => Object.keys(av[s] || {}).forEach(k => keys.add(k)));
  if(!keys.size) return "";
  const cols = orderedKeys(sport, keys);
  let h = `<div class="pdtitle">Averages</div><div class="tblwrap"><table><tr><th>Avg</th>` +
    cols.map(k => `<th class="num">${esc(statShort(k))}</th>`).join("") + `</tr>`;
  [["Season", av.season, av.gpSeason], ["Last 10", av.l10, av.gpL10], ["Last 5", av.l5, av.gpL5]].forEach(row => {
    const map = row[1] || {}, gp = row[2];
    h += `<tr><td><b>${row[0]}</b>${isNum(gp) ? ` <span class="pmeta">(${gp} gp)</span>` : ""}</td>` +
      cols.map(k => `<td class="num">${fd(map[k], statDP(sport, k))}</td>`).join("") + `</tr>`;
  });
  return h + `</table></div>`;
}
function renderPropTable(p){
  const line = p.line || {}, proj = p.proj || {};
  const stats = Object.keys(line);
  let h = "";
  if(stats.length){
    h += `<div class="pdtitle">Lines & projections</div><div class="tblwrap"><table><tr><th>Stat</th><th class="num">Line</th><th class="num">Projection</th></tr>`;
    stats.forEach(k => {
      h += `<tr><td>${esc(statLabel(k))}</td><td class="num">${f1(line[k])}</td><td class="num">${proj[k]!=null?"<b>"+f1(proj[k])+"</b>":"—"}</td></tr>`;
    });
    h += `</table></div>`;
  } else if(Object.keys(proj).length){
    h += `<div class="vs-line">Projections: ` + Object.keys(proj).slice(0,8).map(k => `${esc(statLabel(k))} <b>${f1(proj[k])}</b>`).join(" · ") + `</div>`;
  } else {
    h += `<div class="note small">No posted lines in this snapshot.</div>`;
  }
  return h;
}
function splitKeyLabel(k){
  const m = { ucl90:"UCL /90", lg90:"League /90", uclGp:"UCL matches", lgGp:"League matches", expMin:"Expected min", subNote:"Sub pattern" };
  return m[k] || String(k).replace(/_/g, " ");
}
function renderSplits(sport, p){
  const sp = p.splits;
  if(!sp || typeof sp !== "object") return "";
  const objKeys = Object.keys(sp).filter(k => sp[k] && typeof sp[k] === "object");
  const scalars = Object.keys(sp).filter(k => !(sp[k] && typeof sp[k] === "object"));
  if(!objKeys.length && !scalars.length) return "";
  let h = `<div class="pdtitle">Splits</div>`;
  if(scalars.length) h += `<div class="note small">` + scalars.map(k => `${esc(splitKeyLabel(k))}: ${esc(sp[k])}`).join(" · ") + `</div>`;
  if(objKeys.length){
    const keys = new Set();
    objKeys.forEach(k => Object.keys(sp[k]).forEach(s => keys.add(s)));
    const cols = orderedKeys(sport, keys);
    h += `<div class="tblwrap"><table><tr><th>Stat</th>` + objKeys.map(k => `<th class="num">${esc(splitKeyLabel(k))}</th>`).join("") + `</tr>`;
    cols.forEach(s => {
      h += `<tr><td>${esc(statShort(s))}</td>` + objKeys.map(k => `<td class="num">${fd(sp[k][s], statDP(sport, s))}</td>`).join("") + `</tr>`;
    });
    h += `</table></div>`;
  }
  return h;
}
function renderLogTable(sport, logs){
  const keys = new Set();
  logs.forEach(g => Object.keys(g.stats || {}).forEach(k => { if(k !== "min") keys.add(k); }));
  const cols = orderedKeys(sport, keys);
  let h = `<div class="pdtitle">Game log — all ${logs.length} recorded games</div><div class="tblwrap"><table><tr><th>Date</th><th>Opp</th><th class="num">MIN</th>` +
    cols.map(k => `<th class="num">${esc(statShort(k))}</th>`).join("") + `</tr>`;
  logs.forEach(g => {
    const st = g.stats || {};
    const mins = isNum(g.minutes) ? g.minutes : st.min;
    h += `<tr><td>${esc(g.date || "")}</td><td>${esc(g.opp || "")}${g.comp ? ` <span class="pmeta">· ${esc(g.comp)}</span>` : ""}</td><td class="num">${isNum(mins) ? fd(mins, sport === "soccer" ? 0 : 1) : "—"}</td>` +
      cols.map(k => `<td class="num">${fd(st[k], statDP(sport, k))}</td>`).join("") + `</tr>`;
  });
  return h + `</table></div>`;
}
function renderBoardPlayer(p, sport){
  const st = detailState[detailKey(sport, p.pkey)] || {open:false, html:null};
  let h = `<div class="player" id="bp-${esc(p.pkey||"")}"><span class="pname">${esc(p.name)}</span>${p.star?" <span class=\"chip amber\">★</span>":""} <span class="pmeta">${esc(p.team||"")}${p.position?" · "+esc(p.position):""}${p.matchup?" · "+esc(p.matchup):""}${p.matchupAt?" · "+esc(fmtDay(p.matchupAt)):""}${p.starter?" · starter":""}${p.isGk?" · GK":""}${p.injCount?" · "+esc(p.injCount)+" inj note(s)":""}</span>`;
  h += `<button class="ptoggle" id="pt-${esc(p.pkey||"")}" data-pkey="${esc(p.pkey||"")}">${st.open ? "Hide details ▴" : "Details — averages & game log ▾"}</button>`;
  h += `<div class="pdetail" id="pd-${esc(p.pkey||"")}" style="display:${st.open ? "block" : "none"}">${st.open ? (st.html || `<div class="note small">Loading game log…</div>`) : ""}</div>`;
  h += `</div>`;
  return h;
}

/* ---------- Grades ---------- */
function resultClass(r){
  const x = String(r||"").toUpperCase();
  if(x === "WIN" || x === "WON") return "win";
  if(x === "LOSS" || x === "LOST") return "loss";
  if(x === "PUSH") return "push";
  return "";
}
function renderGrades(d){
  const meta = d.meta||{};
  let h = "";
  if(meta.headline) h += `<div class="meta-note">${esc(meta.headline)}</div>`;
  if(nonEmptyArr(meta.bySource)){
    h += `<div>` + meta.bySource.map(s => `<span class="chip gray">${esc(s.sourceLabel||s.source)}: ${esc(s.wins)}–${esc(s.losses)}${s.pushes?"–"+esc(s.pushes):""} (${esc(s.picks)} picks)</span>`).join("") + `</div>`;
  }
  (meta.notes||[]).forEach(n => { h += `<div class="note small">${esc(n)}</div>`; });
  const grades = d.grades||[];
  if(grades.length){
    h += `<div class="tblwrap"><table><tr><th>Date</th><th>Player / Side</th><th>Market</th><th class="num">Line</th><th class="num">Proj</th><th class="num">Actual</th><th>Result</th><th>Source</th></tr>`;
    grades.forEach(g => {
      h += `<tr><td>${esc(g.pickDate||"")}</td><td><b>${esc(g.player||"")}</b>${g.team?" ("+esc(g.team)+")":""} — ${esc(g.side||"")}</td><td>${esc(g.market||"")}</td><td class="num">${esc(g.lineText||"")}</td><td class="num">${esc(g.projectionText||"—")}</td><td class="num">${esc(g.actualText||"—")}</td><td class="${resultClass(g.result)}">${esc(g.result||"")}</td><td>${esc(g.sourceLabel||"")}</td></tr>`;
      if(g.note) h += `<tr><td></td><td colspan="7" class="note small">${esc(g.note)}</td></tr>`;
    });
    h += `</table></div>`;
  } else if(!meta.headline){
    h += `<div class="empty">No graded picks in this snapshot.</div>`;
  }
  return h;
}

/* ---------- Movement feed ---------- */
function evtText(e){
  const line = e.newLine != null ? e.newLine : e.oldLine;
  const lt = e.lineType ? ` (${e.lineType})` : "";
  if(e.kind === "line_changed" || (e.oldLine != null && e.newLine != null && e.oldLine !== e.newLine)){
    const dir = e.newLine > e.oldLine ? "up" : "down";
    return `<span class="mv ${dir}">${f1(e.oldLine)} → ${f1(e.newLine)}</span> ${esc(e.stat||"")}${lt}`;
  }
  if(e.kind === "type_changed"){
    return `<span class="mv">${esc(e.oldLineType||"")} → ${esc(e.lineType||"")} @ ${f1(line)}</span> ${esc(e.stat||"")}`;
  }
  if(e.kind === "removed") return `<span class="mv down">line removed</span> ${esc(e.stat||"")}${lt}${e.oldLine!=null?" (was "+f1(e.oldLine)+")":""}`;
  if(e.kind === "added") return `<span class="mv up">new line @ ${f1(line)}</span> ${esc(e.stat||"")}${lt}`;
  return `<span class="mv">${esc(e.kind||"")}</span> ${esc(e.stat||"")}${lt}${line!=null?" @ "+f1(line):""}`;
}
async function renderFeed(){
  const root = document.getElementById("feedRoot");
  try {
    const d = await loadJSON("data/getMovementFeed.json");
    const evts = (d.events||[]).slice(0, 200);
    let h = `<div class="kv">Line movements today: <b>${esc(d.todayCount)}</b> · Feed as of ${esc(fmtET(d.asOf,true))} ET · showing latest ${evts.length}</div>`;
    evts.forEach(e => {
      h += `<div class="evt"><span class="et">${esc(fmtET(e.ts))} ET</span><span><b>${esc(e.player||"")}</b>${e.team?" ("+esc(e.team)+")":""} — ${evtText(e)} <span class="pmeta">· ${esc(e.book||"")} · ${esc(e.sport||"")}</span></span></div>`;
    });
    if(!evts.length) h += `<div class="empty">No movement events in this snapshot.</div>`;
    root.innerHTML = h;
  } catch(e){
    root.innerHTML = `<div class="err">Movement feed could not be loaded from the snapshot.</div>`;
  }
}

/* ---------- boot ---------- */
(async function(){
  const stampEl = document.getElementById("stamp");
  try {
    META = await loadJSON("data/getMeta.json");
    let freshest = 0;
    (META.sports||[]).forEach(s => { if(isNum(s.updatedAt)) freshest = Math.max(freshest, s.updatedAt); });
    try {
      const feed = await loadJSON("data/getMovementFeed.json");
      const t = Date.parse(feed.asOf||"");
      if(!isNaN(t)) freshest = Math.max(freshest, t);
    } catch(e){}
    stampEl.textContent = freshest ? ("Board data as of " + fmtET(freshest, true) + " ET") : "Snapshot board";
    const order = ["nba","nfl","soccer","tennis","cs2","nhl"];
    const params = new URLSearchParams(location.search);
    const wantSport = (params.get("sport")||"").toLowerCase();
    const wantSec = (params.get("sec")||"").toLowerCase();
    const first = (wantSport && (META.sports||[]).some(m => m.sport === wantSport)) ? wantSport
      : (order.find(s => (META.sports||[]).some(m => m.sport === s)) || (META.sports[0] && META.sports[0].sport));
    if(first){
      if(wantSec) curSection[first] = wantSec;
      await selectSport(first);
    }
  } catch(e){
    stampEl.textContent = "Snapshot failed to load";
    document.getElementById("sportRoot").innerHTML = `<div class="err">The board snapshot could not be loaded.</div>`;
  }
  renderFeed();
})();
</script>
